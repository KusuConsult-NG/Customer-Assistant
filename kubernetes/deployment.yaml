apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-api-deployment
  labels:
    app: ace-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ace-api
  template:
    metadata:
      labels:
        app: ace-api
    spec:
      containers:
      - name: ace-api
        image: aceplatform/api:v2.0.0
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /api/organizations/me
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/organizations/me
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ace-api-service
spec:
  type: ClusterIP
  selector:
    app: ace-api
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ace-web-deployment
  labels:
    app: ace-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ace-web
  template:
    metadata:
      labels:
        app: ace-web
    spec:
      containers:
      - name: ace-web
        image: aceplatform/web:v2.0.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ace-web-service
spec:
  type: LoadBalancer
  selector:
    app: ace-web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
