version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ace_postgres
    restart: always
    environment:
      POSTGRES_USER: ace_user
      POSTGRES_PASSWORD: ace_secure_password_2030!
      POSTGRES_DB: ace_customer_assistance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace_user -d ace_customer_assistance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ace_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ace_user:ace_secure_password_2030!@postgres:5432/ace_customer_assistance?schema=public
      # DIRECT_URL is only consumed by `prisma migrate`, but the schema declares
      # it, so keep it in sync with DATABASE_URL for local compose.
      DIRECT_URL: postgresql://ace_user:ace_secure_password_2030!@postgres:5432/ace_customer_assistance?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_ace_jwt_token_key_2030
      # The API's startup validation (env.validation.ts) hard-exits if any of
      # the variables below are missing — without them this container was a
      # crash loop (exit 1 + restart: always). Values come from your local .env
      # (docker compose reads it automatically); dev defaults keep local boots
      # working, but WhatsApp/AI features need real values to function.
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_ace_refresh_token_key_2030}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-local-dev-not-a-real-key}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-local-dev-whatsapp-app-secret}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-local-dev-verify-token}
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: ace_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
