services:
  # ─── 1. API Backend (NestJS) ─────────────────────────────────────────────────
  # REGION MUST MATCH THE DATABASE.
  #
  # Measured: with the API in oregon and the Supabase project in eu-central-1, every
  # query is a transatlantic round trip — ~950ms observed per round trip, and a single
  # list request makes 4. Co-locating the API with the database is the single largest
  # latency win available and costs nothing.
  #
  # Set this to the region of your Supabase project (Dashboard → Settings → General).
  - type: web
    name: ace-api
    env: node
    region: frankfurt
    # NOT an optimisation — a correctness requirement for the voice channel.
    #
    # `starter` spins down after ~15 minutes idle and takes 30-60s to wake.
    # Twilio allows roughly 15 SECONDS for the inbound-call webhook to return
    # TwiML, so a cold start overruns it and the caller hears a carrier error
    # instead of the assistant. There is no retry: that customer is gone, at
    # the exact hour a 24/7 line is supposed to be the whole point.
    #
    # Two schedulers inside this process also stop while it sleeps —
    # appointment reminders and the inline workflow sweeper are setInterval
    # timers, so a reminder due on a sleeping service is skipped, not delayed.
    #
    # WhatsApp survives a cold start (Meta retries, and messages.externalId
    # stops the retry double-posting); web chat just makes the visitor wait.
    # Voice is the one that fails outright.
    plan: standard
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/api...
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → ace-api → Environment
      - key: API_BASE_URL
        sync: false           # e.g. https://ace-api.onrender.com
      - key: WEB_BASE_URL
        sync: false           # e.g. https://ace-web.onrender.com
      - key: CORS_ORIGIN
        sync: false           # e.g. https://ace-web.onrender.com
      # RUNTIME connection: Supavisor TRANSACTION mode on port 6543 with
      # pgbouncer=true. Port 5432 is SESSION mode, which holds one Postgres backend
      # per client and hard-caps at pool_size 15 — measured returning HTTP 500
      # (EMAXCONNSESSION) past ~15 concurrent requests.
      - key: DATABASE_URL
        sync: false           # postgresql://…:6543/postgres?pgbouncer=true&connection_limit=15
      # MIGRATIONS ONLY: direct/session connection on port 5432.
      - key: DIRECT_URL
        sync: false           # postgresql://…:5432/postgres
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      # Required by startup validation (env.validation.ts) — the API exits(1)
      # without these two. APP_SECRET verifies X-Hub-Signature-256 on webhooks;
      # VERIFY_TOKEN answers Meta's GET verification handshake.
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # Render terminates TLS at its proxy; trust 1 hop so per-IP rate limiting
      # sees real client IPs instead of the proxy's (see main.ts).
      - key: TRUST_PROXY
        value: "1"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Signs outbound webhooks to customer endpoints. Without it the dispatcher
      # falls back to a secret that is hardcoded in the repository.
      - key: WEBHOOK_SECRET
        sync: false
      # Vector search + background document ingestion.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Voice AI.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false

  # ─── 2. Web Dashboard (Next.js) ──────────────────────────────────────────────
  - type: web
    name: ace-web
    env: node
    region: frankfurt
    # `starter` is a COST DECISION with a customer-facing consequence — read
    # this before assuming the dashboard is internal-only.
    #
    # This service also serves /widget.js, which every visitor to an embedding
    # customer's website fetches. If it is cold, the chat bubble does not
    # appear on their site until this wakes. Staff waiting on a cold dashboard
    # is an annoyance; a widget missing from the customer's homepage is not.
    #
    # Three ways out, cheapest first:
    #   1. Put /widget.js behind a CDN or object storage, so the embed does not
    #      depend on this service being awake at all.
    #   2. Serve /widget.js from ace-api, which is already `standard`.
    #   3. Move this service to `standard` too.
    # Until one of those is done, the widget's availability is this plan's.
    plan: starter
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/web...
    startCommand: cd apps/web && npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ace-api.onrender.com           # must match ace-api URL, e.g. https://ace-api.onrender.com
