services:
  # ─── 1. API Backend (NestJS) ─────────────────────────────────────────────────
  # REGION MUST MATCH THE DATABASE.
  #
  # Measured: with the API in oregon and the Supabase project in eu-central-1, every
  # query is a transatlantic round trip — ~950ms observed per round trip, and a single
  # list request makes 4. Co-locating the API with the database is the single largest
  # latency win available and costs nothing.
  #
  # Set this to the region of your Supabase project (Dashboard → Settings → General).
  - type: web
    name: ace-api
    env: node
    # Declared rather than left to whatever the dashboard was set to when the
    # service was created. A fix can sit on main for hours while the running
    # service still serves the old build, and nothing in the repository says
    # which it should be — so this says it.
    branch: main
    autoDeploy: true
    region: frankfurt
    # NOT an optimisation — a correctness requirement for the voice channel.
    #
    # `starter` spins down after ~15 minutes idle and takes 30-60s to wake.
    # Twilio allows roughly 15 SECONDS for the inbound-call webhook to return
    # TwiML, so a cold start overruns it and the caller hears a carrier error
    # instead of the assistant. There is no retry: that customer is gone, at
    # the exact hour a 24/7 line is supposed to be the whole point.
    #
    # Two schedulers inside this process also stop while it sleeps —
    # appointment reminders and the inline workflow sweeper are setInterval
    # timers, so a reminder due on a sleeping service is skipped, not delayed.
    #
    # WhatsApp survives a cold start (Meta retries, and messages.externalId
    # stops the retry double-posting); web chat just makes the visitor wait.
    # Voice is the one that fails outright.
    plan: standard
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/api...
    startCommand: node apps/api/dist/main.js
    # Runs after the build and BEFORE the new version serves traffic, with the
    # service's real DATABASE_URL — the build cannot do this, because it runs
    # `prisma generate` against a dummy URL and never reaches the database.
    #
    # It adds enum VALUES that schema.prisma declares and the database lacks,
    # and nothing else: no column, table or constraint is touched, and nothing
    # is ever dropped. That is the gap `autoDeploy: true` leaves open. A new
    # COLUMN breaks reads loudly and immediately, so it gets noticed. A new
    # enum value breaks only the one statement that writes it, while every
    # other request on the deployment succeeds.
    #
    # `WHATSAPP_CLOUD` is what that costs. Added to TelephonyProviderType and
    # deployed, with `whatsapp.service.ts` writing it on every inbound WhatsApp
    # call event: absent from the database, PostgreSQL rejects the upsert,
    # processCallEvent throws, and the message explaining to the citizen why
    # their call went unanswered never sends. Silence, from the commit written
    # to stop exactly that.
    #
    # Deliberately NOT `prisma db push`: that reconciles the whole schema and
    # can drop columns and tables, which is not something to run unattended
    # against production. Schema changes beyond enum values still need
    # `npm run db:push` run by a person before the deploy, as CLAUDE.md says.
    preDeployCommand: node scripts/sync-enum-values.js --apply
    # The DEEP check. Render routes traffic by this, so it must mean "can
    # serve" and not merely "process is up" — a pod with no database
    # reporting healthy is a pod being handed requests it will fail.
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → ace-api → Environment
      - key: API_BASE_URL
        sync: false           # e.g. https://ace-api.onrender.com
      - key: WEB_BASE_URL
        sync: false           # e.g. https://ace-web.onrender.com
      - key: CORS_ORIGIN
        sync: false           # e.g. https://ace-web.onrender.com
      # RUNTIME connection: Supavisor TRANSACTION mode on port 6543 with
      # pgbouncer=true. Port 5432 is SESSION mode, which holds one Postgres backend
      # per client and hard-caps at pool_size 15 — measured returning HTTP 500
      # (EMAXCONNSESSION) past ~15 concurrent requests.
      - key: DATABASE_URL
        sync: false           # postgresql://…:6543/postgres?pgbouncer=true&connection_limit=15
      # MIGRATIONS ONLY: direct/session connection on port 5432.
      - key: DIRECT_URL
        sync: false           # postgresql://…:5432/postgres
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # Credentials at rest. EVERY provider credential — a tenant's ElevenLabs
      # workspace key, its Twilio auth token, its WhatsApp access token — is
      # AES-256-GCM encrypted with this, and storing one is REFUSED outright
      # when it is unset. Writing it in the clear is not an option this system
      # offers, so a deployment without this key cannot save a tenant's
      # credentials at all: POST /api/agent-provisioning/credentials throws.
      #
      # Not `generateValue: true`. The key must be exactly 32 bytes, and a
      # short or wrong-length value is REJECTED rather than stretched — a
      # hashed passphrase looks strong in every log and review and is not.
      # Generate it yourself: openssl rand -base64 32
      - key: ENCRYPTION_KEY
        sync: false
      # Only during a key rotation: tried on decrypt, never on write. Remove it
      # once `npm run secrets:encrypt -- --apply` has re-encrypted everything,
      # which is what lets a rotation happen without every credential going
      # dark at once.
      - key: ENCRYPTION_KEY_PREVIOUS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── Answering inbound WhatsApp calls ───────────────────────────────
      #
      # OFF unless WHATSAPP_CALL_ANSWER is 1. Left blank on purpose: without
      # these four the platform records a WhatsApp call and replies to the
      # citizen by message, which works today. Setting the flag WITHOUT a
      # working TURN relay is worse than leaving it off — the service refuses
      # to answer in that case, because an answered call with no media route
      # consumes the caller, reports completed at the carrier and suppresses
      # the message fallback.
      #
      # WebRTC media is UDP and a Render web service exposes one HTTP port with
      # no inbound UDP, so media CANNOT reach this pod directly. It has to
      # relay through TURN, reached outbound. That is a real dependency with
      # real per-minute bandwidth cost, not a nicety.
      #
      # NO REAL CALL HAS EVER BEEN ANSWERED BY THIS CODE. The signalling is
      # unit-tested and the SDP answer comes from a real WebRTC stack, but the
      # media bridge is unproven. Treat the first call as the test, and expect
      # to debug it.
      - key: WHATSAPP_CALL_ANSWER
        sync: false
      # Either run your own relay (TURN_URL + TURN_USERNAME + TURN_CREDENTIAL),
      # or set TURN_PROVIDER=twilio to mint ephemeral credentials from the
      # Twilio account this deployment already holds. The Twilio route needs no
      # server of your own; the static route keeps media on infrastructure you
      # control, which is the stronger position for citizen calls.
      - key: TURN_PROVIDER
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # Optional overrides for the model endpoint. Set LLM_BASE_URL to run
      # against an OpenAI-compatible gateway or a self-hosted model; the rest
      # pick the chat and embedding models. All four fall back to the defaults
      # in code, so a deployment that wants stock behaviour leaves them unset.
      #
      # EMBEDDING_DIMENSIONS must match the vectors already in Qdrant — change
      # it and existing points stop matching, which reads as the knowledge base
      # having gone empty rather than as a configuration change.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_CHAT_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_DIMENSIONS
        sync: false
      # NOT READ BY ANYTHING, and kept only because they are already set on
      # deployments that predate this note.
      #
      # Sending always uses the AGENCY's own stored row, and an inbound message
      # is resolved by the `phoneNumberId` Meta sends against that same table —
      # so a deployment can hold a perfectly good token here, show it set in
      # the Render dashboard, and still log "no config found" for every message
      # a citizen sends. A line is connected at Settings → WhatsApp
      # (POST /api/organizations/whatsapp-config) and nowhere else; writing the
      # row straight into the database bypasses the encryption-at-rest path.
      # GET /api/diagnostics/providers says so when an agency has no line.
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      # Required by startup validation (env.validation.ts) — the API exits(1)
      # without these two. APP_SECRET verifies X-Hub-Signature-256 on webhooks;
      # VERIFY_TOKEN answers Meta's GET verification handshake.
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      # ── Answering a citizen's call IN THE DASHBOARD ────────────────────────
      #
      # Leave blank and nothing changes: inbound calls go straight to the AI
      # exactly as they always have. Set all three (plus TWILIO_ACCOUNT_SID
      # above) and an inbound call rings every signed-in officer's browser
      # first, falling back to the AI if none of them picks up.
      #
      # TWILIO_API_KEY_SID is NOT the Account SID and NOT the Auth Token. It
      # is a separate credential pair created in the Twilio console, and its
      # secret is shown once.
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      # ── Deepgram speech model ──────────────────────────────────────────────
      #
      # Leave blank for nova-2, which is what this platform has always used.
      # nova-3 is more accurate and is Deepgram's current recommendation, but
      # changing which model hears every citizen is a decision that wants
      # evidence on Nigerian English, not a default flipped in passing. Set
      # nova-3 here to try it without a deploy. This is also the lever if
      # nova-2 is retired — which is how eleven_turbo_v2 became a problem.
      - key: DEEPGRAM_MODEL
        sync: false
      # ── ElevenLabs model ids ───────────────────────────────────────────────
      #
      # Leave blank for the defaults (eleven_flash_v2 / eleven_flash_v2_5).
      #
      # These exist because a model id ages out. The platform had
      # `eleven_turbo_v2` hardcoded and described as "confirmed"; it is
      # deprecated, and ElevenLabs has removed models outright before
      # (Multilingual v1 and Scribe v1, July 2026). On a removal EVERY call on
      # both channels goes silent at the same moment — a rejected TTS request
      # returns no audio to a caller who is already connected — from a third
      # party's release notes, with a valid API key and a green credential
      # check. So the fix must not need a code change and a build.
      #
      # GET /api/diagnostics/providers verifies the configured models against
      # ElevenLabs' own list and names what it offers.
      - key: ELEVENLABS_MODEL_EN
        sync: false
      - key: ELEVENLABS_MODEL_MULTILINGUAL
        sync: false
      # ── Graph API version for the CALLING settings calls ───────────────────
      #
      # A Graph version decides which EDGES exist, not just which fields. The
      # rest of the WhatsApp code calls v21.0 (October 2024), which predates
      # the Calling API — and Meta refuses a missing edge with its single most
      # misleading error:
      #
      #   Unsupported post request. Object with ID '<id>' does not exist,
      #   cannot be loaded due to missing permissions, or does not support
      #   this operation.
      #
      # Three unrelated faults in one sentence, and the phone number id is the
      # only one most people read — so an operator spends hours checking an id
      # that was right all along. The calling calls therefore use their own
      # version, defaulting to v24.0, and this exists so a newer one can be
      # tried without a code change. Leave it blank for the default. Anything
      # not shaped like vNN.N is ignored rather than put in the URL, because
      # Graph reads an unparseable segment as part of the path.
      - key: META_GRAPH_VERSION
        sync: false
      # Render terminates TLS at its proxy; trust 1 hop so per-IP rate limiting
      # sees real client IPs instead of the proxy's (see main.ts).
      # A WhatsApp conversation that goes quiet is closed with a sign-off
      # pointing at the State's own channels. Minutes of silence before that
      # happens; CONVERSATION_CLOSING_DISABLED=1 turns it off entirely.
      #
      # It sends UNPROMPTED messages to citizens, so two bounds are built in
      # and are not configurable: never during a handoff or a flow in
      # progress, and never outside WhatsApp's 24-hour window, which Meta
      # refuses anyway.
      - key: CONVERSATION_CLOSING_MINUTES
        value: "5"
      - key: CONVERSATION_CLOSING_DISABLED
        sync: false
      - key: TRUST_PROXY
        value: "1"
      # Also not read — see WHATSAPP_ACCESS_TOKEN above.
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      # Email goes out over HTTPS, from whichever provider is configured.
      #
      # SMTP is not an option on this host: Render blocks outbound traffic to
      # ports 25, 465 and 587 on free web services, so any relay times out with
      # a network error that reads nothing like a configuration problem.
      #
      # ONE of these is enough. EMAIL_PROVIDER names which to use when several
      # are set; without it the first one present wins, so a deployment already
      # holding RESEND_API_KEY is unchanged. Every route back into a staff
      # account — the invitation, the verification, the password reset — is an
      # email, so a rejected key locks every officer out until it is replaced.
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # Brevo needs EMAIL_FROM to be one of its VERIFIED senders as well as a
      # valid key: an unverified sender accepts every probe and refuses every
      # send. GET /api/diagnostics/providers checks both and names which half
      # is missing.
      - key: BREVO_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: POSTMARK_SERVER_TOKEN
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      # Signs outbound webhooks to customer endpoints. Without it the dispatcher
      # falls back to a secret that is hardcoded in the repository.
      - key: WEBHOOK_SECRET
        sync: false
      # Vector search + background document ingestion.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Voice AI.
      - key: DEEPGRAM_API_KEY
        sync: false
      # TTS, and the SHARED hosted-agent workspace. Deliberately NOT paired here
      # with ELEVENLABS_ALLOW_SHARED_WORKSPACE: an ElevenLabs workspace has no
      # tenancy of its own, so on a multi-tenant deployment every tenant needs
      # its own key (POST /api/agent-provisioning/credentials) and hosted-agent
      # calls are refused until they have one. Setting the opt-in here would put
      # every tenant's numbers, WhatsApp lines and transcripts in one bucket.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # Post-call signing secret for the SHARED workspace. Unset,
      # /api/webhooks/elevenlabs returns 500 and every transcript is retried
      # rather than trusted. A tenant with its OWN workspace stores its own
      # secret and receives on /api/webhooks/elevenlabs/:organizationId, which
      # has no env fallback on purpose — falling back would check one tenant's
      # transcripts against another workspace's secret.
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      # Set to a residency host (api.eu.residency.elevenlabs.io,
      # api.in.residency.elevenlabs.io) to keep conversation data in
      # jurisdiction. Unset uses the default US endpoint.
      - key: ELEVENLABS_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Ed25519 public key for Telnyx webhook verification. UNSET, the Telnyx
      # inbound route logs a warning and accepts every request — and that route
      # resolves a tenant from the dialled number and then drives the AI, which
      # answers the caller and can write bookings and tickets. Set it on any
      # deployment that points a Telnyx number here.
      - key: TELNYX_PUBLIC_KEY
        sync: false

  # ─── 2. Web Dashboard (Next.js) ──────────────────────────────────────────────
  - type: web
    name: ace-web
    env: node
    branch: main
    autoDeploy: true
    region: frankfurt
    # `starter` is a COST DECISION with a customer-facing consequence — read
    # this before assuming the dashboard is internal-only.
    #
    # This service also serves /widget.js, which every visitor to an embedding
    # customer's website fetches. If it is cold, the chat bubble does not
    # appear on their site until this wakes. Staff waiting on a cold dashboard
    # is an annoyance; a widget missing from the customer's homepage is not.
    #
    # Three ways out, cheapest first:
    #   1. Put /widget.js behind a CDN or object storage, so the embed does not
    #      depend on this service being awake at all.
    #   2. Serve /widget.js from ace-api, which is already `standard`.
    #   3. Move this service to `standard` too.
    # Until one of those is done, the widget's availability is this plan's.
    plan: starter
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/web...
    startCommand: cd apps/web && npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ace-api.onrender.com           # must match ace-api URL, e.g. https://ace-api.onrender.com
