services:
  # ─── 1. API Backend (NestJS) ─────────────────────────────────────────────────
  - type: web
    name: ace-api
    env: node
    region: oregon
    plan: starter          # upgrade to standard for 24/7 uptime (no spin-down)
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/api...
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → ace-api → Environment
      - key: API_BASE_URL
        sync: false           # e.g. https://ace-api.onrender.com
      - key: WEB_BASE_URL
        sync: false           # e.g. https://ace-web.onrender.com
      - key: CORS_ORIGIN
        sync: false           # e.g. https://ace-web.onrender.com
      - key: DATABASE_URL
        sync: false           # your Supabase pooler URL (port 6543, pgbouncer=true)
      - key: DIRECT_URL
        sync: false           # your Supabase direct URL (port 5432)
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_BUSINESS_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false

  # ─── 2. Web Dashboard (Next.js) ──────────────────────────────────────────────
  - type: web
    name: ace-web
    env: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: >
      npm install --include=dev &&
      DATABASE_URL="postgresql://dummy:dummy@localhost/dummy"
      DIRECT_URL="postgresql://dummy:dummy@localhost/dummy"
      npx prisma generate --schema=packages/database/prisma/schema.prisma &&
      npx turbo run build --filter=@ace/web...
    startCommand: cd apps/web && npx next start -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://ace-api.onrender.com           # must match ace-api URL, e.g. https://ace-api.onrender.com
