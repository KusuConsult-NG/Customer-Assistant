services:
  # ─── 1. API Backend (NestJS) ────────────────────────────────────────────────
  - type: web
    name: ace-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      - key: META_APP_ID
        value: "1568914798311983"
      - key: META_BUSINESS_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: ACE_SECURE_VERIFY_TOKEN_2026
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: ACE Platform <noreply@kusuconsult.com>

  # ─── 2. Web Dashboard (Next.js) ──────────────────────────────────────────────
  - type: web
    name: ace-web
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: cd apps/web && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
