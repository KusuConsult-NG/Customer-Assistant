# The whole platform on ONE server.
#
#   cp server.env.example server.env    # fill it in (see README.md)
#   ./deploy.sh                         # build, start, update the schema, check
#
# Only Caddy publishes ports (80 and 443). The database, Redis, Qdrant, the API
# and the dashboard are reachable only on this compose network — the old
# root docker-compose.yml published PostgreSQL on 5432 and Redis on 6379 to
# every interface, which on a public server is the database on the internet.
#
# The call bridge (Asterisk) uses the HOST network, because SIP and RTP carry
# the server's public address inside the messages and need the 10000–20000
# UDP range; Docker's port publishing of ten thousand ports is slow and
# rewrites addresses the SIP messages still claim. It gets 4x the CPU share
# of everything else, so a busy dashboard cannot make a call stutter.

name: ace

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server.env}
      POSTGRES_DB: ace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=1GB", "-c", "effective_cache_size=3GB"]
    shm_size: 512mb
    mem_limit: 2g
    pids_limit: 300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ace -d ace"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: an evicted job key is a document that is never indexed.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 768m
    pids_limit: 128
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.12.6
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in server.env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
      secrets: [extra_ca]
    image: ace-api:latest
    restart: unless-stopped
    env_file: server.env
    environment:
      # Fixed by this layout, so not left to server.env to get wrong.
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://ace:${POSTGRES_PASSWORD}@postgres:5432/ace?connection_limit=20
      DIRECT_URL: postgresql://ace:${POSTGRES_PASSWORD}@postgres:5432/ace
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      API_BASE_URL: https://${DOMAIN}
      WEB_BASE_URL: https://${DOMAIN}
      WEB_INTERNAL_URL: http://web:3000
      CORS_ORIGIN: https://${DOMAIN}
      # Caddy is the one proxy in front: trust exactly one hop of X-Forwarded-For.
      TRUST_PROXY: "1"
      STORAGE_DIR: /data/files
      # Empty unless EXTRA_CA_CERT is set (a network that re-signs TLS): then
      # the API's calls to OpenAI, ElevenLabs, Meta, … trust that CA as well.
      NODE_EXTRA_CA_CERTS: /etc/ssl/extra-ca.pem
      # Files live on this server's disk (the `files` volume, backed up
      # nightly). Blank here so a SUPABASE_URL copied over from the old
      # environment cannot quietly send uploads back to Supabase.
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # The voice line's AudioSocket must accept the bridge's connection,
      # which reaches the container through the localhost port below.
      AUDIOSOCKET_HOST: 0.0.0.0
    # LOCALHOST ONLY: for the phone bridge, which runs on the host's network
    # (network_mode: host) and asks the API who is calling before the agent
    # answers (/api/sip-bridge/caller), and for the voice line's AudioSocket.
    # Nothing outside this server can reach either; Caddy stays the only door.
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:9092:9092"
    volumes:
      - files:/data/files
      - ./.extra-ca.pem:/etc/ssl/extra-ca.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    mem_limit: 2g
    pids_limit: 512
    stop_grace_period: 30s
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: Dockerfile.web
      secrets: [extra_ca]
      args:
        # The dashboard and the API share one origin (Caddy routes /api), so the
        # dashboard calls the API on whatever address it was loaded from. A
        # fixed address was compiled in before, and the site is reached through
        # a tunnel whose address changes on every restart: each new address
        # left every officer's dashboard calling the old one until a rebuild.
        NEXT_PUBLIC_API_URL: same-origin
    image: ace-web:latest
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: [api]
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      # The address Caddy serves publicly. Normally the domain itself (Caddy
      # then fetches its certificate). Behind a named Cloudflare Tunnel, set to
      # http://:8081 in server.env: no public port is open, Cloudflare holds
      # the certificate, and asking Let's Encrypt for one could only fail.
      CADDY_PUBLIC_SITE: ${CADDY_PUBLIC_SITE:-${DOMAIN}}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in server.env (certificate expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    logging: *logging

  bridge:
    build:
      context: ../..
      dockerfile: deploy/single-server/bridge/Dockerfile
    image: ace-bridge:latest
    restart: unless-stopped
    network_mode: host
    # The calls come first. Default share is 1024; this is four times that, so
    # under contention the kernel gives the bridge the CPU before anything else.
    cpu_shares: 4096
    mem_limit: 1g
    pids_limit: 512
    stop_grace_period: 30s
    env_file:
      - path: ../../infra/sip-bridge/bridge.env
        required: false
    volumes:
      - ./bridge/sounds:/opt/bridge/sounds:ro
    profiles: ["bridge"]
    logging: *logging

  # A NAMED Cloudflare Tunnel: the way in when no inbound port is open. It
  # connects OUT to Cloudflare and carries the dashboard, the API, WhatsApp
  # and ElevenLabs' webhooks to Caddy's internal :8080 listener. Runs only
  # when CLOUDFLARE_TUNNEL_TOKEN is set (lib.sh turns the profile on). The
  # route (public hostname -> http://caddy:8080) is set in Cloudflare's
  # dashboard, not here. Pinned: a tunnel daemon that updates itself is a
  # change nobody deployed.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [caddy]
    profiles: ["tunnel"]
    logging: *logging

secrets:
  # Only for a network that re-signs TLS (see Dockerfile.api). Empty by default.
  # deploy.sh copies EXTRA_CA_CERT here (empty when unset): the build may
  # read only files inside this folder.
  extra_ca:
    file: ./.extra-ca.pem

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  files:
  caddy_data:
  caddy_config:
