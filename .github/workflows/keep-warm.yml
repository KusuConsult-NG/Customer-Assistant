# Keep the API awake, so a citizen's call is never the thing that wakes it.
#
# ── The problem this exists for ─────────────────────────────────────────────
#
# A Render instance that has spun down takes tens of seconds to come back —
# 43s and 84s were measured against this deployment. A carrier gives a webhook
# roughly 10 to 15 seconds before it gives up, so the first call after an idle
# period is DROPPED, and the service then looks perfectly healthy when somebody
# checks it by hand a minute later. That is the worst shape a fault can take:
# invisible to the person testing, and only ever suffered by a citizen.
#
# An instance that is never idle never spins down. This pings the health probe
# often enough to keep it that way.
#
# ── What this does and does not buy ─────────────────────────────────────────
#
# It makes a cold start UNLIKELY, not impossible. A deploy, a crash, a platform
# restart or a run that GitHub delays all put the instance back to sleep, and
# the next caller pays for it. It is a mitigation, not a guarantee — a paid
# plan that does not spin down is the guarantee.
#
# Two things about GitHub's scheduler worth knowing before trusting it:
#   · `schedule` is best-effort. Runs are queued and can be minutes late under
#     load, so the interval is well inside the spin-down window rather than at
#     its edge.
#   · GitHub disables scheduled workflows in a repository with no activity for
#     60 days. A quiet repo serving a live helpline is exactly the case where
#     that bites, so `workflow_dispatch` is here to restart it by hand.
#
# ── Why the URL is hardcoded with a variable as an override ─────────────────
#
# It was ONLY `vars.API_BASE_URL`, and that variable was never set, so every
# run did this and nothing else:
#
#   API_BASE_URL:
#   API_BASE_URL repository variable is not set — nothing to keep warm.
#
# The job reported SUCCESS each time, because skipping cleanly was the designed
# behaviour — so a green tick meant "pinged nothing", and the instance went on
# spinning down. Worse, the variable looks set from where an operator stands:
# `API_BASE_URL` also exists as an environment variable on the API service
# itself, which is a different place entirely, and setting it there does
# nothing for this workflow.
#
# So the default is the real address. It is not a secret — it is the public
# address citizens' carriers post to — and a keep-warm job that needs manual
# setup before it keeps anything warm is a job that quietly does not run.
# `vars.API_BASE_URL` still overrides it, for a different deployment.

name: Keep API warm

on:
  schedule:
    # Every 10 minutes. Render's free tier sleeps after 15 minutes idle, so
    # this leaves room for a late run without the instance dropping off.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health probe
        env:
          # The repository variable wins when it is set; otherwise the known
          # production address, so this works with no setup at all.
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://ace-api-n7ix.onrender.com' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            # Only reachable if someone sets the variable to an empty string.
            echo "::error::API_BASE_URL resolved to nothing, so this run kept nothing warm."
            exit 1
          fi

          url="${API_BASE_URL%/}/api/health"
          start=$(date +%s%3N)
          # --max-time 120: a request that WAKES a sleeping instance is slow by
          # definition, and timing out on it would defeat the point.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$url" || echo 000)
          end=$(date +%s%3N)
          ms=$((end - start))

          echo "$url -> HTTP $code in ${ms}ms"

          if [ "$code" != "200" ]; then
            echo "::warning::Health probe answered $code. The API may be down, not merely asleep."
            exit 1
          fi

          # Reported, not failed: a slow answer here means this run WOKE the
          # instance, which is the job working rather than a fault. A carrier
          # would have given up at ~10s, so it is worth seeing in the log.
          if [ "$ms" -gt 10000 ]; then
            echo "::warning::Took ${ms}ms — the instance had spun down. A real call arriving then would have been dropped."
          fi
