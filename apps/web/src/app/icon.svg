<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ACE Platform">
  <!--
    App icon. Next.js App Router serves src/app/icon.svg as the favicon, which
    is why this file exists at all: every page load previously requested
    /favicon.ico, got a 404, and logged a console error on every route.

    The mark matches the sidebar logo — an indigo-to-violet rounded square with
    a four-point spark — so the browser tab reads as the same product.
  -->
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#a)"/>
  <path
    d="M32 13c1.6 8.2 4.8 11.4 13 13-8.2 1.6-11.4 4.8-13 13-1.6-8.2-4.8-11.4-13-13 8.2-1.6 11.4-4.8 13-13Z"
    fill="#fff"/>
  <circle cx="45.5" cy="45.5" r="4.5" fill="#fff" opacity=".9"/>
</svg>
